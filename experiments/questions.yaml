# Evaluation question bank for the RAG experiments.
#
# Each question is phrased the way a stakeholder (investment committee member, board
# trustee, client-relations analyst, risk/finance team) might actually ask it. Gold answers
# were looked up BY HAND in the 2025 annual reports and are encoded as regex groups:
#
#   must:       list of groups; a group is a list of alternative regexes. The answer must
#               match >= 1 alternative in EVERY group to count as correct (partial credit =
#               fraction of groups matched).
#   forbid:     regexes that must NOT appear (e.g. another fund's number = contamination).
#               For refuse items, a forbidden figure is tolerated only when the answer
#               refuses explicitly ("I don't have that ...") and labels it as a different figure.
#   expect:     answer          -> must be answered with the gold facts
#               refuse          -> the data does not contain it; must refuse / say not available
#               correct_premise -> the question has a false premise; the answer must correct it
#   funds:      which fund(s) the question is about (hoopp | aimco | omers | governed)
#   gold_pages: page numbers (1-based PDF page index) that hold the answer, per fund
#   rounds:     which experiment rounds use the question (r1 = HOOPP-only corpus)
#
# Categories: kpi (headline number), table (needs an extracted table), reasoning
# (compare / rank / multi-hop), people, metric (governed metric layer), cross (several
# funds), ambiguous (no fund named), trap (refuse / false premise).

